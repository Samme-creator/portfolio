<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Syed Samiullah</title>
<meta name="description" content="Ask a quick question about Syed Samiullah — who he is, what he builds, and how to reach him.">
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --bg-raised: #0D0D0D;
    --bg-raised-2: #151515;
    --text: #FFFFFF;
    --text-dim: #A3A3A3;
    --line: #2A2A2A;
    --accent: #C9A24B;
    --accent-soft: rgba(201, 162, 75, 0.12);
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; color-scheme: dark; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- header ---------- */
  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .chat-header .back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 14px;
    transition: color 0.2s ease;
  }

  .chat-header .back-link:hover { color: var(--text); }
  .chat-header .back-link svg { width: 16px; height: 16px; }

  .chat-header .who {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .chat-header .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .chat-header .who-text .name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
  }

  .chat-header .who-text .status {
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .chat-header .who-text .status::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4ADE80;
    animation: pulse 2.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* ---------- message area ---------- */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .msg {
    max-width: 78%;
    padding: 13px 16px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.55;
    animation: msgIn 0.25s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.bot {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }

  .msg.user {
    background: var(--accent);
    color: var(--bg);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }

  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 14px 16px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    border-bottom-left-radius: 4px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: typingBounce 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* ---------- input / quick replies area ---------- */
  .chat-input-area {
    flex-shrink: 0;
    border-top: 1px solid var(--line);
    background: rgba(11, 12, 13, 0.9);
    backdrop-filter: blur(10px);
    padding: 16px 20px 20px;
  }

  .quick-replies {
    max-width: 720px;
    margin: 0 auto 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .quick-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13.5px;
    padding: 9px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }

  .quick-btn:hover, .quick-btn:focus-visible {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-1px);
  }

  .chat-form {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }

  .chat-form input {
    flex: 1;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 24px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    padding: 12px 18px;
  }

  .chat-form input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .chat-form button {
    background: var(--accent);
    border: none;
    color: var(--bg);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .chat-form button:hover { background: #DDB65D; transform: scale(1.05); }
  .chat-form button svg { width: 18px; height: 18px; }

  @media (prefers-reduced-motion: reduce) {
    .msg { animation: none; }
    .typing span { animation: none; }
    .chat-header .who-text .status::before { animation: none; }
  }
</style>
</head>
<body>

<header class="chat-header">
  <a class="back-link" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Portfolio
  </a>
  <div class="who">
    <div class="who-text" style="text-align: right;">
      <div class="name">Syed Samiullah</div>
      <div class="status" style="justify-content: flex-end;">Usually replies fast</div>
    </div>
    <div class="avatar">S</div>
  </div>
</header>

<div class="chat-messages" id="chatMessages">
  <div class="msg bot">Hi, I'm a quick-reply assistant for Syed's portfolio — not a live AI, just fast answers to the questions people usually ask. Tap a question below, or type your own and I'll match it if I can.</div>
</div>

<div class="chat-input-area">
  <div class="quick-replies" id="quickReplies"></div>
  <form class="chat-form" id="chatForm">
    <input type="text" id="chatInput" placeholder="Type a question…" autocomplete="off">
    <button type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </form>
</div>

<script>
  const qa = [
    {
      keys: ["who are you", "who is syed", "about you", "yourself"],
      q: "Who are you?",
      a: "I'm Syed Samiullah, an AI/ML student at the University of Malakand, currently interning at FlyRank.ai across machine learning and applied AI fluency."
    },
    {
      keys: ["profession", "what do you do", "job", "work"],
      q: "What's your profession — what do you actually do?",
      a: "I build practical AI and data-driven solutions using Python, machine learning, and modern data science tools — real, working software, not just demos or notebooks."
    },
    {
      keys: ["built", "projects", "portfolio", "made"],
      q: "What have you built?",
      a: "Three real projects: MediCare Pro Extra (a full pharmacy management system with a SQLite schema and secure authentication), a supervised ML pipeline for FlyRank's content-refresh scoring, and a terminal-based ATM simulator. All linked on the portfolio page."
    },
    {
      keys: ["tech", "stack", "tools", "language", "python"],
      q: "What tech do you work with?",
      a: "Python, SQLite, scikit-learn, and DuckDB, with Git/GitHub for everything. I also use Claude as a genuine build partner throughout my process, not just for one-off answers."
    },
    {
      keys: ["contact", "reach", "email", "call", "hire"],
      q: "How can I contact you?",
      a: "Easiest ways: use the contact form on the portfolio page, book a call directly on Calendly, or email me — all linked in the top buttons there."
    }
  ];

  const messagesEl = document.getElementById('chatMessages');
  const quickRepliesEl = document.getElementById('quickReplies');
  const formEl = document.getElementById('chatForm');
  const inputEl = document.getElementById('chatInput');

  function addMessage(text, from) {
    const div = document.createElement('div');
    div.className = 'msg ' + from;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function respond(answer) {
    showTyping();
    setTimeout(() => {
      removeTyping();
      addMessage(answer, 'bot');
    }, 500);
  }

  function renderQuickReplies() {
    quickRepliesEl.innerHTML = '';
    qa.forEach((item) => {
      const btn = document.createElement('button');
      btn.className = 'quick-btn';
      btn.type = 'button';
      btn.textContent = item.q;
      btn.addEventListener('click', () => {
        addMessage(item.q, 'user');
        respond(item.a);
      });
      quickRepliesEl.appendChild(btn);
    });
  }

  function findAnswer(text) {
    const lower = text.toLowerCase();
    for (const item of qa) {
      if (item.keys.some(k => lower.includes(k))) return item.a;
    }
    return "I don't have a quick answer for that one — this is a simple keyword-matched assistant, not a live AI. For anything specific, the best move is to use the contact form or book a call on the portfolio page.";
  }

  formEl.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    inputEl.value = '';
    respond(findAnswer(text));
  });

  renderQuickReplies();
</script>

</body>
</html>
